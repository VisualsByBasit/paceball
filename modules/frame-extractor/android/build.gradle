plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.frameextractor'
version = '0.1.0'

android {
  namespace "expo.modules.frameextractor"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Match expo-video exactly. Mixing Media3 versions in one Android app can
  // compile and then fail at runtime when a class moved between releases.
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-transformer:${androidxMedia3Version}"
  implementation "androidx.media3:media3-effect:${androidxMedia3Version}"
}
